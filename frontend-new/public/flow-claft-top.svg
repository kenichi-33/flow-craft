<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 85" width="420" height="85" role="img" aria-label="flow craft logo">
  <defs>
    <linearGradient id="craft-grad-v5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C" />
      <stop offset="100%" style="stop-color:#F59E0B" />
    </linearGradient>
    <linearGradient id="flow-grad-v5" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#3B82F6" />
      <stop offset="100%" style="stop-color:#22C55E" />
    </linearGradient>
    <filter id="shadow-v5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g transform="translate(10, 18) scale(0.95)">
    <g>
      <rect x="0" y="5" width="42" height="34" rx="3" fill="#FFF" stroke="url(#craft-grad-v5)" stroke-width="2.5" />
      <rect x="5" y="12" width="32" height="6" rx="1" fill="#F3F4F6" />
      <line x1="7" y1="15" x2="25" y2="15" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="24" r="3" fill="#E5E7EB" />
      <line x1="14" y1="24" x2="30" y2="24" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="31" r="3" fill="#F59E0B" />
      <line x1="14" y1="31" x2="25" y2="31" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
      <g filter="url(#shadow-v5)" transform="translate(28, -2)">
        <rect x="0" y="0" width="18" height="14" rx="2" fill="url(#craft-grad-v5)" stroke="#FFF" stroke-width="1" transform="rotate(-8)"/>
        <line x1="9" y1="3" x2="9" y2="11" stroke="#FFF" stroke-width="2" stroke-linecap="round" transform="rotate(-8, 9, 7)"/>
        <line x1="5" y1="7" x2="13" y2="7" stroke="#FFF" stroke-width="2" stroke-linecap="round" transform="rotate(-8, 9, 7)"/>
      </g>
    </g>

    <g transform="translate(46, 0)">
        <path d="M0 22 C 3 22, 5 15, 10 15" stroke="url(#flow-grad-v5)" stroke-width="4.5" fill="none" stroke-linecap="round" />
        <path d="M8 12 L12 15 L8 18" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(62, 4)">
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#3B82F6" />
        <path d="M6 11 L10 15 L17 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g transform="translate(105, 52)">
    <text font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="48" letter-spacing="-1.5">
      <tspan fill="#111827">flow</tspan>
      <tspan fill="#F59E0B">craft</tspan>
    </text>
    <text x="3" y="22" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#374151" letter-spacing="1.2">
      WORKFLOW &amp; FORM BUILDER
    </text>
  </g>
</svg>