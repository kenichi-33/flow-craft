<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="flow craft favicon">
  <defs>
    <linearGradient id="fav-craft-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C" />
      <stop offset="100%" style="stop-color:#F59E0B" />
    </linearGradient>
    <linearGradient id="fav-flow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#3B82F6" />
      <stop offset="100%" style="stop-color:#22C55E" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="2" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="12" fill="#FFFFFF" filter="url(#fav-shadow)" />

  <g transform="translate(8, 8)">
    <g transform="translate(4, 4) rotate(-8, 10, 10)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#fav-craft-grad)" />
      <line x1="10" y1="5" x2="10" y2="15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="5" y1="10" x2="15" y2="10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>

    <path d="M 22 24 C 26 24, 28 30, 34 30" stroke="url(#fav-flow-grad)" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 31 27 L 36 30 L 31 33" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <g transform="translate(26, 26)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#3B82F6" />
      <path d="M 5 10 L 9 14 L 15 6" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>